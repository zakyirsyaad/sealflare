name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript tests and typecheck
    runs-on: ubuntu-latest
    steps:
      # The indexer tests run against the stub contracts on a local Anvil, so this job needs
      # Foundry and the contract libraries.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: pnpm -r typecheck

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Format
        working-directory: contracts
        run: forge fmt --check src test script
      - name: Size under the 24 KB limit
        run: forge build --root contracts --sizes --skip test --skip script
      - name: Unit, fuzz, invariant and end-to-end tests
        run: forge test --root contracts

  abi:
    name: ABI in sync with interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - run: forge build --root contracts
      - run: pnpm abi:check

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/web build

  e2e:
    name: End-to-end suite
    runs-on: ubuntu-latest
    # The suite needs a database of its own and a browser of its own, so it does not share
    # anything with the other jobs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sealflare_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite uses this database instead of starting a throwaway cluster of its own.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sealflare_e2e
    steps:
      # The harness starts Anvil with the stub contracts, so this job needs Foundry and the
      # contract libraries.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser of the suite
        run: pnpm --filter @sealflare/web exec playwright install --with-deps chromium
      - name: Run the suite against the local stack
        # The log of the harness holds the output of the app, the indexer and the internal
        # service, so it is kept next to the traces of the browser.
        run: |
          set -o pipefail
          pnpm e2e 2>&1 | tee e2e-harness.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: apps/web/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-harness-log
          path: e2e-harness.log
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
