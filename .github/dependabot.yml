# Version updates for GitHub Actions and Docker. npm version updates stay off until after the hackathon;
# security updates for npm still arrive through Dependabot security updates in the repo settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /packages/sandbox-worker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
