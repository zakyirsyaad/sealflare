<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<div style="padding: 24px; background: var(--background); display: flex; gap: 40px; flex-wrap: wrap; align-items: center; font-family: var(--font-sans); color: var(--foreground)">
<div style="display: flex; gap: 14px; align-items: center"><svg class="sf-seal" width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Sealed"><circle class="sf-seal__track" cx="38" cy="38" r="31" stroke-width="9"/><circle class="sf-seal__arc" cx="38" cy="38" r="31" stroke-width="9"/></svg><span style="font-size: 24px; line-height: 28px; font-weight: 600; letter-spacing: -0.03em">Community safe</span></div>
<div style="display: flex; gap: 14px; align-items: center"><svg class="sf-seal sf-seal--caution" width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Caution"><circle class="sf-seal__track" cx="38" cy="38" r="31" stroke-width="9"/><circle class="sf-seal__arc" cx="38" cy="38" r="31" stroke-width="9" stroke-dasharray="148 47" transform="rotate(-70 38 38)"/></svg><span style="font-size: 24px; line-height: 28px; font-weight: 600; letter-spacing: -0.03em">Caution flagged</span></div>
<div style="display: flex; gap: 14px; align-items: center"><svg class="sf-seal sf-seal--broken" width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Broken"><circle class="sf-seal__track" cx="38" cy="38" r="31" stroke-width="9"/><circle class="sf-seal__arc" cx="38" cy="38" r="31" stroke-width="9" stroke-dasharray="110 85" transform="rotate(-50 38 38)"/></svg><span style="font-size: 24px; line-height: 28px; font-weight: 600; letter-spacing: -0.03em">Confirmed danger</span></div>
<div style="display: flex; gap: 14px; align-items: center"><svg class="sf-seal sf-seal--empty" width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Not rated"><circle class="sf-seal__arc" cx="38" cy="38" r="31" stroke-width="9" stroke-dasharray="4 8"/></svg><span style="font-size: 24px; line-height: 28px; font-weight: 600; letter-spacing: -0.03em">Not rated yet</span></div>
</div>
