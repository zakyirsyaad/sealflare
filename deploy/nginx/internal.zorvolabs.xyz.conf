# nginx site for the Sealflare internal service. Installed to /etc/nginx/sites-available/ and
# linked from sites-enabled/; certbot adds the TLS server block. Vercel is the only intended
# client: every request must also carry INTERNAL_KEY, checked by the internal service itself.

server {
    listen 80;
    listen [::]:80;
    server_name internal.zorvolabs.xyz;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
