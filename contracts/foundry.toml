[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Fork tests need BSC_RPC_URL and run only under the fork profile (`pnpm test:fork`).
no_match_path = "test/fork/*"
fs_permissions = [
  { access = "read", path = "../shared/rules/vectors" },
  { access = "read", path = "src" },
  { access = "read-write", path = "../shared/abi" },
]

[fuzz]
runs = 512

[lint]
# Tests cast fuzz and vector values on purpose; stubs and scripts are local-only code.
ignore = ["test/**/*.sol", "src/stubs/**/*.sol", "script/**/*.sol"]

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.fork]
match_path = "test/fork/*"
no_match_path = "test/__nothing__/*"

[fmt]
# Frozen at v0-frozen: formatting them would change files the other lanes build on.
ignore = [
  "src/interfaces/**/*.sol",
  "src/lib/Constants.sol",
  "src/lib/Rules.sol",
  "src/lib/Ids.sol",
  "src/lib/BindTypes.sol",
]
