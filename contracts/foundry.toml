[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read", path = "../shared/rules/vectors" },
  { access = "read-write", path = "../shared/abi" },
]

[fuzz]
runs = 512

[lint]
# Test code casts fuzz and vector values on purpose.
ignore = ["test/**/*.sol"]
