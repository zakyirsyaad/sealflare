[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read", path = "../shared/rules/vectors" },
  { access = "read", path = "src" },
  { access = "read-write", path = "../shared/abi" },
]

[fuzz]
runs = 512

[lint]
# Tests cast fuzz and vector values on purpose; stubs and scripts are local-only code.
ignore = ["test/**/*.sol", "src/stubs/**/*.sol", "script/**/*.sol"]

[invariant]
runs = 256
depth = 64
fail_on_revert = false
